name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      separate_install:
        description: Install alongside the original app (recommended for testing)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setu      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
p-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: npm install --no-audit --no-fund
      - name: Set separate application ID for testing
        if: ${{ inputs.separate_install }}
        run: |
          node -e "const fs=require('fs'),p='capacitor.config.json',c=require('./'+p); c.appId+='.tasks';c.appName+=' (کارهای روز)';fs.writeFileSync(p,JSON.stringify(c));"
      - run: npx cap add android
      - name: Configure version and optional stable debug signature
        env:
          DEBUG_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $((1000 + GITHUB_RUN_NUMBER))/;s/versionName \"[^\"]+\"/versionName \"1.1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          if [ -n "$DEBUG_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
